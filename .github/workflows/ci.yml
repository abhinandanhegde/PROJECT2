name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Verify no forbidden dependencies
        run: |
          ! grep -r "openai\|anthropic\|langchain\|llm\|celery\|redis\|docker\|pgvector" backend/requirements.txt backend/requirements-test.txt || false
